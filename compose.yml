services:
  db:
    image: pgvector/pgvector:pg18
    shm_size: 256mb
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./db-data-pg18:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
