[settings]
experimental = true

[daemons.postgres]
image = "docker.io/pgvector/pgvector:pg18"
proxy = false
data_mount = "/var/lib/postgresql"
data_dir = ".data/mise-postgres"
command = ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
env = { POSTGRES_INITDB_ARGS = "--auth-host=scram-sha-256" }
runtime_args = ["--network=host", "--shm-size=256m", "--env=PGPORT", "--env=POSTGRES_DB", "--env=POSTGRES_USER", "--env=POSTGRES_PASSWORD"]
volumes = ["./tools/mise/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"]
ready_cmd = { run = '''{{ runtime }} exec {{ container }} sh -c 'test "$(cat /proc/1/comm)" = postgres && pg_isready -h /var/run/postgresql -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-${POSTGRES_USER:-postgres}}"' ''', timeout = "180s" }

[daemons.app]
depends = ["postgres"]
proxy = false
init = "sh ./tools/mise/init-app.sh"
run = "exec bun run --cwd apps/server start"
ready_cmd = { run = 'curl -fsS -o /dev/null --max-time 3 --noproxy 127.0.0.1 "http://127.0.0.1:${NITRO_PORT:?}/api/health"', timeout = "60s" }

[daemons.nginx]
depends = ["app"]
image = "docker.io/library/nginx:trixie"
proxy = false
runtime_args = ["--network=host", "--env=NITRO_PORT", "--env=NGINX_PORT", "--env=NGINX_TLS_PORT"]
env = { NGINX_ENVSUBST_OUTPUT_DIR = "/etc/nginx", NGINX_ENVSUBST_FILTER = "^(NITRO_PORT|NGINX_PORT|NGINX_TLS_PORT)$" }
init = "sh ./tools/mise/init-nginx.sh"
volumes = [
    "./.data/mise-nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro",
    "./.data/mise-nginx/letsencrypt:/etc/letsencrypt:ro",
]
ready_cmd = { run = '''{{ runtime }} exec {{ container }} sh -c 'grep -zFxq "nginx: worker process" /proc/[0-9]*/cmdline 2>/dev/null' ''', timeout = "180s" }

[tasks.attach_db]
run = 'psql -h "${DB_HOST:-${PGHOST:-127.0.0.1}}" -p "$PGPORT" -U "${POSTGRES_USER:-${DB_USER:-${PGUSER:-postgres}}}" "${POSTGRES_DB:-${DB_DATABASE:-${DB_NAME:-${PGDATABASE:-postgres}}}}"'

[env]
_.file = '.env'
PGPORT = "{% if env.PGPORT %}{{ env.PGPORT }}{% elif env.DB_PORT %}{{ env.DB_PORT }}{% else %}5432{% endif %}"
NITRO_PORT = "{% if env.NITRO_PORT %}{{ env.NITRO_PORT }}{% elif env.PORT %}{{ env.PORT }}{% else %}3000{% endif %}"
NGINX_PORT = "{% if env.NGINX_PORT %}{{ env.NGINX_PORT }}{% else %}80{% endif %}"
NGINX_TLS_PORT = "{% if env.NGINX_TLS_PORT %}{{ env.NGINX_TLS_PORT }}{% else %}443{% endif %}"
AGENT_BROWSER_SOCKET_DIR = "/tmp/solid-imager-agent-browser"

[tools]
bun = "latest"
java = "21.0.2"
rust = "latest"
"npm:chrome-devtools-mcp" = "latest"
android-sdk = "latest"
"npm:agent-browser" = "latest"
aube = "latest"
