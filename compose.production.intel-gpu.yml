services:
  app:
    image: localhost/solid-imager-runtime:n100-gpu
    build:
      context: ./.cache/n100-runtime-build
      dockerfile: ../../Dockerfile.runtime.intel-gpu
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      ORT_DYLIB_PATH: /usr/lib/libonnxruntime.so.1
    volumes:
      - ./.cache/n100-models:/root/.cache
