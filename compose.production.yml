services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: ${APP_RUNTIME_IMAGE:-solid-imager-runtime:python3}
    container_name: solid-imager-app
    restart: always
    working_dir: /app
    environment:
      DB_HOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-}}
      DB_POSTGRES_DRIVER: ${DB_POSTGRES_DRIVER:-bun-sql}
      REST_PUBLIC_ORIGIN: ${REST_PUBLIC_ORIGIN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${NITRO_PORT:-${PORT:-3000}}
    volumes:
      # APP_ARTIFACT_DIR must point to the host directory that already
      # contains node_modules and apps/server/.output.
      - ${APP_ARTIFACT_DIR:-.}:/app
    command: ["bun", "run", "start"]
    depends_on:
      - db

  nginx:
    image: docker.io/library/nginx:trixie
    container_name: solid-imager-nginx
    restart: always
    environment:
      NITRO_PORT: ${NITRO_PORT:-${PORT:-3000}}
      NGINX_PORT: ${NGINX_PORT:-80}
      NGINX_TLS_PORT: ${NGINX_TLS_PORT:-443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^(NITRO_PORT|NGINX_PORT|NGINX_TLS_PORT)$$"
    ports:
      - "${NGINX_PORT:-80}:${NGINX_PORT:-80}/tcp"
      - "${NGINX_TLS_PORT:-443}:${NGINX_TLS_PORT:-443}/tcp"
      - "${NGINX_TLS_PORT:-443}:${NGINX_TLS_PORT:-443}/udp"
    volumes:
      - ${NGINX_CONFIG:-./nginx.conf}:/etc/nginx/templates/nginx.conf.template:ro
      - ${HOME}/.config/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
