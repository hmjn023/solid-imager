services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: ${APP_IMAGE:-solid-imager-app:latest}
    container_name: solid-imager-app
    restart: always
    environment:
      DB_HOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-}}
      DB_POSTGRES_DRIVER: ${DB_POSTGRES_DRIVER:-bun-sql}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      CONFIG_AI_BASE_URL: ${INFERENCE_BASE_URL:-http://inference:3001}
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:-}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${NITRO_PORT:-${PORT:-3000}}
    volumes:
      - app-config:/app/config
      - app-cache:/app/apps/server/.cache
    depends_on:
      - db

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    image: ${INFERENCE_IMAGE:-solid-imager-inference:latest}
    restart: always
    environment:
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-cpu}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-}
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:-}
    volumes:
      - type: bind
        source: ${INFERENCE_ORT_DIR:-./onnxruntime/lib}
        target: /opt/onnxruntime/lib
        read_only: true
        bind:
          create_host_path: false
      - inference-cache:/var/cache/inference

  nginx:
    image: docker.io/library/nginx:trixie
    container_name: solid-imager-nginx
    restart: always
    environment:
      NITRO_PORT: ${NITRO_PORT:-${PORT:-3000}}
      NGINX_PORT: ${NGINX_PORT:-80}
      NGINX_TLS_PORT: ${NGINX_TLS_PORT:-443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^(NITRO_PORT|NGINX_PORT|NGINX_TLS_PORT)$$"
    ports:
      - "${NGINX_PORT:-80}:${NGINX_PORT:-80}/tcp"
      - "${NGINX_TLS_PORT:-443}:${NGINX_TLS_PORT:-443}/tcp"
      - "${NGINX_TLS_PORT:-443}:${NGINX_TLS_PORT:-443}/udp"
    volumes:
      - ${NGINX_CONFIG:-./nginx.conf}:/etc/nginx/templates/nginx.conf.template:ro
      - ${HOME}/.config/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  app-config:
  app-cache:
  inference-cache:
